# Déploiement de production — IMAGE UNIQUE QuizDock (front+back).
# `docker compose -f docker-compose.prod.yml up -d`.
# L'image `quizdock` sert l'app sur :3000 ; Postgres + Redis sont externes ;
# le service `migrate` (one-shot, même image) applique les migrations au démarrage.
name: quizdock

services:
  postgres:
    image: postgres:16-alpine
    # Back after a reboot of the server, like Keycloak; `./quizdock down` keeps it stopped.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-live}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-live}
      POSTGRES_DB: ${POSTGRES_DB:-quizdock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-live} -d ${POSTGRES_DB:-quizdock}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    # Back after a reboot of the server, like Keycloak; `./quizdock down` keeps it stopped.
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # Created idempotently, including when the PostgreSQL volume predates this preset.
  keycloak-db:
    image: postgres:16-alpine
    profiles: ['keycloak']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-live}
      PGPASSWORD: ${POSTGRES_PASSWORD:-live}
      # Keycloak's own role (an install made by `init --full` since 0.13.2): its
      # database belongs to it, and it reaches nothing of QuizDock's. Unset (older
      # installs), Keycloak keeps the database superuser, as before.
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$KEYCLOAK_DB_USER" ] &&
          ! psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$$KEYCLOAK_DB_USER'" | grep -qx 1; then
          # Read from stdin: psql substitutes :"name" and :'pass' there, quoted, not in -c.
          psql -d postgres -v ON_ERROR_STOP=1 -v name="$$KEYCLOAK_DB_USER" -v pass="$$KEYCLOAK_DB_PASSWORD" <<'SQL'
        CREATE ROLE :"name" LOGIN PASSWORD :'pass';
        SQL
        fi
        if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -qx 1; then
          createdb ${KEYCLOAK_DB_USER:+--owner="$$KEYCLOAK_DB_USER"} keycloak
        fi
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    profiles: ['keycloak']
    # Render the shared dev realm for full mode without an additional template or JSON-tool dependency.
    # Keycloak skips importing an existing realm, so restarts never reset accounts.
    entrypoint: ['/bin/bash', '-ec']
    command:
      - |
        realm=$$(< /opt/keycloak/data/realm-export.json)
        realm=$${realm//'"temporary": false'/'"temporary": true'}
        realm=$${realm//'"requiredActions": []'/'"requiredActions": ["UPDATE_PASSWORD"]'}
        mkdir -p /opt/keycloak/data/import
        printf '%s' "$$realm" > /opt/keycloak/data/import/quiz-dock-realm.json
        exec /opt/keycloak/bin/kc.sh start --http-enabled=true --import-realm
    environment:
      KC_HEALTH_ENABLED: 'true'
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-${POSTGRES_USER:-live}}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-${POSTGRES_PASSWORD:-live}}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-admin}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:${KEYCLOAK_PORT:-18081}}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KEYCLOAK_APP_URL: ${KEYCLOAK_APP_URL:-${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:${HTTP_PORT:-18080}}
      KEYCLOAK_DEV_URL: ${KEYCLOAK_APP_URL:-${PUBLIC_SCHEME:-http}://${PUBLIC_HOST:-localhost}:${HTTP_PORT:-18080}}
      KEYCLOAK_HOST_PASSWORD: ${KEYCLOAK_HOST_PASSWORD:-change-me-host}
      KEYCLOAK_PLAYER_PASSWORD: ${KEYCLOAK_PLAYER_PASSWORD:-change-me-player}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/realm-export.json:ro
    ports:
      - '${KEYCLOAK_PORT:-18081}:8080'
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; read -r line <&3; [[ $$line == *\" 200 \"* ]]'"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    networks: [internal, public]

  # QuizDock's own database role (an install made by `quizdock init` since 0.13.2):
  # the database belongs to it, the superuser is kept for administering PostgreSQL.
  # Unset (older installs), the app keeps the superuser, as before. A role set on a
  # database that already holds data stops here: moving it is a manual step.
  quizdock-db:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-live}
      PGPASSWORD: ${POSTGRES_PASSWORD:-live}
      POSTGRES_DB: ${POSTGRES_DB:-quizdock}
      QUIZDOCK_DB_USER: ${QUIZDOCK_DB_USER:-}
      QUIZDOCK_DB_PASSWORD: ${QUIZDOCK_DB_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        [ -n "$$QUIZDOCK_DB_USER" ] || exit 0
        if ! psql -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname = '$$QUIZDOCK_DB_USER'" | grep -qx 1; then
          # Read from stdin: psql substitutes :"name" and :'pass' there, quoted, not in -c.
          psql -d postgres -v ON_ERROR_STOP=1 -v name="$$QUIZDOCK_DB_USER" -v pass="$$QUIZDOCK_DB_PASSWORD" <<'SQL'
        CREATE ROLE :"name" LOGIN PASSWORD :'pass';
        SQL
        fi
        owner="$$(psql -d postgres -tAc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = '$$POSTGRES_DB'")"
        [ "$$owner" = "$$QUIZDOCK_DB_USER" ] && exit 0
        if [ "$$(psql -d "$$POSTGRES_DB" -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public'")" != 0 ]; then
          echo "QUIZDOCK_DB_USER is set, but $$POSTGRES_DB already holds data owned by $$owner: see the upgrade notes to move it." >&2
          exit 1
        fi
        psql -d postgres -v ON_ERROR_STOP=1 -v db="$$POSTGRES_DB" -v name="$$QUIZDOCK_DB_USER" <<'SQL'
        ALTER DATABASE :"db" OWNER TO :"name";
        SQL
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    networks: [internal]

  # Migrations idempotentes (Prisma). One-shot : applique puis sort. L'app attend
  # sa complétion. Même image que `quizdock`, commande surchargée (l'ENTRYPOINT
  # distroless est déjà `node`, donc on passe le chemin du CLI Prisma).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: fchaussin/quizdock:${QUIZDOCK_TAG:-latest}
    command: ['node_modules/prisma/build/index.js', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgres://${QUIZDOCK_DB_USER:-${POSTGRES_USER:-live}}:${QUIZDOCK_DB_PASSWORD:-${POSTGRES_PASSWORD:-live}}@postgres:5432/${POSTGRES_DB:-quizdock}
    depends_on:
      postgres:
        condition: service_healthy
      quizdock-db:
        condition: service_completed_successfully
    # The same hardening as the app's (below): it runs the same image.
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    read_only: true
    tmpfs: ['/tmp']
    restart: 'no'
    networks: [internal]

  quizdock:
    build:
      context: .
      dockerfile: Dockerfile
    image: fchaussin/quizdock:${QUIZDOCK_TAG:-latest}
    # Back after a reboot of the server, like Keycloak; `./quizdock down` keeps it stopped.
    restart: unless-stopped
    environment:
      # The generation of these files: the backend says when they are older than the image.
      QUIZDOCK_FILES: '2'
      NODE_ENV: production
      PORT: '3000'
      AUTH_MODE: ${AUTH_MODE:-none}
      # Démo publique (garde-fous, indépendant de AUTH_MODE) — cf. https://quizdock.github.io/docs/operator/configuration/
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: postgres://${QUIZDOCK_DB_USER:-${POSTGRES_USER:-live}}:${QUIZDOCK_DB_PASSWORD:-${POSTGRES_PASSWORD:-live}}@postgres:5432/${POSTGRES_DB:-quizdock}
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /data/media
      STORE_DIR: /data/store
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-10485760}
      MEDIA_MAX_VIDEO_MB: ${MEDIA_MAX_VIDEO_MB:-50}
      MEDIA_MAX_AUDIO_MB: ${MEDIA_MAX_AUDIO_MB:-10}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-52428800}
      QUIZ_STORE_URL: ${QUIZ_STORE_URL:-}
      QUIZ_STORE_HOSTS: ${QUIZ_STORE_HOSTS-github.com,release-assets.githubusercontent.com}
      UPDATE_CHECK: ${UPDATE_CHECK:-true}
      PUBLICATION_MAX_MB: ${PUBLICATION_MAX_MB:-20}
      MEDIA_LIBRARY_LINKS: ${MEDIA_LIBRARY_LINKS:-}
      GAME_AUTO_ADVANCE_MS: ${GAME_AUTO_ADVANCE_MS:-5000}
      # Transitions between steps on the live screens, the rooms' default (on | off).
      LIVE_MOTION: ${LIVE_MOTION:-on}
      GAME_READ_DELAY_MS: ${GAME_READ_DELAY_MS:-3000}
      GAME_ALL_ANSWERED_DELAY_MS: ${GAME_ALL_ANSWERED_DELAY_MS:-1000}
      GAME_MEDIA_WAIT_S: ${GAME_MEDIA_WAIT_S:-10}
      # Adresse des invitations (QR, lien) proposée à l'animateur ; IP LAN si le conteneur ne voit pas l'hôte.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      HOST_LAN_IPS: ${HOST_LAN_IPS:-}
      # White-label : nom d'app + langue de l'instance (servis via /config.js).
      APP_NAME: ${APP_NAME:-QuizDock}
      APP_LANG: ${APP_LANG:-en}
      # Vide = logo cherché dans `branding/` (tous formats web), sinon celui de l'image.
      APP_LOGO_URL: ${APP_LOGO_URL:-}
      APP_FEEDBACK_URL: ${APP_FEEDBACK_URL:-}
      # Administration: what the web may change (read | write), what it never may.
      ADMIN_WEB_SCOPE: ${ADMIN_WEB_SCOPE:-read}
      ADMIN_LOCK: ${ADMIN_LOCK:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_OVERRIDES: ${ADMIN_OVERRIDES:-apply}
      CLIENT_DIR: /app/client
      # Auth OIDC (si AUTH_MODE=oidc).
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_URL: ${OIDC_INTERNAL_URL:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-quiz-dock-frontend}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-roles}
      OIDC_NAME_CLAIM: ${OIDC_NAME_CLAIM:-}
      # Proxies allowed to speak for the client (X-Forwarded-For/-Proto); empty = private addresses.
      TRUST_PROXY: ${TRUST_PROXY:-}
      ALLOW_ANONYMOUS_PARTICIPANTS: ${ALLOW_ANONYMOUS_PARTICIPANTS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - mediadata:/data/media
      - storedata:/data/store
      # White-label des assets (optionnel) : décommente pour remplacer logo + CSS
      # par un dossier `./branding/` local. Laissé commenté → logo par défaut bundlé.
      # - ./branding:/app/client/branding:ro
    ports:
      - '${HTTP_PORT:-18080}:3000'
    healthcheck:
      # distroless : pas de shell/wget → healthcheck via node (fetch global, Node 24).
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    # Durcissement (cf. ADR / docker-compose.yml) : non-root via l'image, FS en
    # lecture seule, aucune capability, pas d'escalade. Médias = volume ; /tmp = tmpfs.
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    read_only: true
    tmpfs: ['/tmp']
    networks: [internal, public]

volumes:
  pgdata:
  redisdata:
  mediadata:
  storedata:

networks:
  internal:
  public:
