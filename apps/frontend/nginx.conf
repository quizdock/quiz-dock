server {
    listen 8080; # image non-root (nginx-unprivileged) : pas de port < 1024
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads: the largest media (a video, MEDIA_MAX_VIDEO_MB) must get through;
    # the backend applies the real limit of each kind.
    client_max_body_size 64m;

    # API REST + doc OpenAPI → backend
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket (gameplay, Socket.IO) → backend, avec upgrade
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # The runtime configuration (name, language, logo, feedback links, motion):
    # the backend's, the one place that reads the instance's settings.
    location = /config.js {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # White-label override sheet: optional. Without this exact-match block the SPA
    # fallback would answer a missing file with index.html, and the browser would
    # refuse text/html as a stylesheet. An empty 204 says "nothing to override".
    location = /branding/override.css {
        try_files $uri =204;
    }

    # The icon (tab, home screen): the operator's in branding/ when given, QuizDock's otherwise.
    location = /favicon.png {
        try_files /branding/favicon.png /icons/quizdock.png =404;
    }

    # Asked again on every visit, so a renamed instance and a new version reach the
    # browser: the manifest written at start, the page itself.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Built files carry their content's hash in their name: kept for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
