name = "quizdock-demo-stats"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# The demo's origin: the only one whose pages may send their time on page.
ALLOWED_ORIGIN = "https://quizdock-standalone.onrender.com"
# The Docker Hub repository whose pull counter is read every night.
DOCKER_REPO = "fchaussin/quizdock"

[[d1_databases]]
binding = "DB"
database_name = "quizdock-demo-stats"
database_id = "ddf86868-78f1-41f3-9956-5e015a796ff0"
migrations_dir = "migrations"

[triggers]
crons = ["5 0 * * *"]
