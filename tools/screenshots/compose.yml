# The demo stack, added to the dev stack by run.sh under its own project
# (quizdock-demo): the dev images and sources, a database and volumes of its own.
# For demos (http://localhost:15183) and for the screenshots; the dev database
# is never touched.
services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  backend:
    image: quiz-dock-backend:latest
    pull_policy: never
    ports: !reset []
    environment:
      APP_LANG: en
      # Local mode whatever the dev stack's .env says: the screenshots sign in by name.
      AUTH_MODE: none
      ALLOW_ANONYMOUS_PARTICIPANTS: 'false'
      # The administration as an operator who allows it: its controls, not its notices.
      # A stack bound to this computer: the token is no secret (shoot.mjs gives it).
      ADMIN_WEB_SCOPE: write
      ADMIN_TOKEN: demo-stack-admin-token-not-a-secret
  frontend:
    image: quiz-dock-frontend:latest
    pull_policy: never
    ports: !override
      - '127.0.0.1:${DEMO_PORT:-15183}:5173'
