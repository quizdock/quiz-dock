name: quiz-dock

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-live}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-live}
      POSTGRES_DB: ${POSTGRES_DB:-quizdock}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-live} -d ${POSTGRES_DB:-quizdock}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  # IdP OIDC d'exemple (dev) : démarré uniquement avec --profile keycloak (AUTH_MODE=oidc).
  # N'importe quel fournisseur OpenID Connect peut le remplacer via les variables OIDC_*.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ['keycloak']
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '${KEYCLOAK_PORT:-18080}:8080'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks: [internal, public]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    environment:
      NODE_ENV: production
      PORT: '3000'
      AUTH_MODE: ${AUTH_MODE:-none}
      # Démo publique (garde-fous, indépendant de AUTH_MODE) — cf. docs/self-hosting §4.
      DEMO_MODE: ${DEMO_MODE:-false}
      DATABASE_URL: postgres://${POSTGRES_USER:-live}:${POSTGRES_PASSWORD:-live}@postgres:5432/${POSTGRES_DB:-quizdock}
      REDIS_URL: redis://redis:6379
      # Médias stockés sur un volume local et servis par le backend (proxy).
      MEDIA_DIR: /data/media
      STORE_DIR: /data/store
      MEDIA_MAX_BYTES: ${MEDIA_MAX_BYTES:-10485760}
      MEDIA_MAX_VIDEO_MB: ${MEDIA_MAX_VIDEO_MB:-50}
      MEDIA_MAX_AUDIO_MB: ${MEDIA_MAX_AUDIO_MB:-10}
      IMPORT_MAX_BYTES: ${IMPORT_MAX_BYTES:-52428800}
      MEDIA_LIBRARY_LINKS: ${MEDIA_LIBRARY_LINKS:-}
      GAME_AUTO_ADVANCE_MS: ${GAME_AUTO_ADVANCE_MS:-5000}
      GAME_READ_DELAY_MS: ${GAME_READ_DELAY_MS:-3000}
      GAME_MEDIA_WAIT_S: ${GAME_MEDIA_WAIT_S:-10}
      # Adresse des invitations (QR, lien) proposée à l'animateur ; IP LAN si le conteneur ne voit pas l'hôte.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      HOST_LAN_IPS: ${HOST_LAN_IPS:-}
      # Auth OIDC (utilisé seulement si AUTH_MODE=oidc). En Docker, l'issuer (host
      # vu par le navigateur) diffère de l'URI JWKS (host interne) — d'où deux
      # variables. Les défauts ciblent l'IdP d'exemple du profil `keycloak`.
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:${KEYCLOAK_PORT:-18080}/realms/quiz-dock}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-http://keycloak:8080/realms/quiz-dock/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-quiz-dock-frontend}
      OIDC_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-realm_access.roles}
      OIDC_NAME_CLAIM: ${OIDC_NAME_CLAIM:-}
      OIDC_SESSION_SCOPE: ${OIDC_SESSION_SCOPE:-browser}
      ALLOW_ANONYMOUS_PARTICIPANTS: ${ALLOW_ANONYMOUS_PARTICIPANTS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mediadata:/data/media
      - storedata:/data/store
    ports:
      - '${BACKEND_PORT:-13000}:3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://127.0.0.1:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    # --- Durcissement (non destructif, niveau runtime) ---
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL'] # node écoute sur 3000 (>1024) : aucune capability requise
    read_only: true # FS racine en lecture seule…
    tmpfs: ['/tmp'] # …sauf /tmp (uploads temporaires) ; les médias vont sur le volume
    networks: [internal, public]

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runtime
    environment:
      # White-label : nom d'app + langue injectés au runtime dans /config.js (sans rebuild).
      APP_NAME: ${APP_NAME:-QuizDock}
      APP_LANG: ${APP_LANG:-en}
      # Vide = logo cherché dans `branding/` (tous formats web), sinon celui de l'image.
      APP_LOGO_URL: ${APP_LOGO_URL:-}
      APP_FEEDBACK_URL: ${APP_FEEDBACK_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-18081}:8080'
    volumes:
      # Override logo + CSS sans rebuild (remplace les fichiers servis).
      - ./branding:/usr/share/nginx/html/branding:ro
    # --- Durcissement : nginx-unprivileged tourne en uid 101 et écoute :8080
    # (> 1024) → aucune capability requise, pas d'escalade.
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    networks: [public]

volumes:
  pgdata:
  redisdata:
  mediadata:
  storedata:

networks:
  internal:
  public:
