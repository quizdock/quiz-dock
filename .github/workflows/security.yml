name: Security

# Deux niveaux de sévérité, volontairement distincts :
#  - job `deps`  → BLOQUE (exit ≠ 0) : CVE applicatives HIGH/CRITICAL, corrigeables
#                  par un bump (pnpm overrides). Actionnable, donc gate.
#  - job `image` → RAPPORTE seulement : CVE de l'OS du base-image, souvent sans
#                  correctif amont (ignore-unfixed) ; remonte dans l'onglet Security
#                  (SARIF) sans repeindre la CI en rouge à tort.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: '27 4 * * 1' # lundi 04:27 UTC — veille hebdo de dérive du base-image
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # upload SARIF → onglet Security (gratuit, repo public)

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Dépendances applicatives : GATE ----
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # nothing is pushed from here

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Trivy AVANT la gate audit : sinon un audit rouge saute le scan, et l'onglet
      # Security affiche « trivy-fs : error » (SARIF absent) au lieu de la vraie cause.
      - name: Trivy — système de fichiers (deps + config)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      - name: Upload SARIF (fs)
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Bloque la PR si une dépendance de prod a une CVE high/critical corrigeable.
      - name: pnpm audit (high+critical) — gate
        run: pnpm audit --prod --audit-level high

  # ---- Images publiées : RAPPORT (non bloquant) ----
  # Les deux images ont des bases différentes (distroless vs bookworm-slim + Postgres
  # + Redis) → un scan chacune, catégorie SARIF distincte pour lire l'onglet Security.
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `trivy-image` garde son nom historique : GitHub ne ferme les alertes
          # d'une catégorie que si elle est ré-analysée.
          - { tag: latest, category: trivy-image }
          - { tag: standalone, category: trivy-image-standalone }
    steps:
      - name: Trivy — image publiée (:${{ matrix.tag }})
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        continue-on-error: true # CVE OS sans patch ne doivent pas casser la CI
        with:
          image-ref: fchaussin/quizdock:${{ matrix.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          format: sarif
          output: trivy-image.sarif

      - name: Upload SARIF (image)
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-image.sarif
          category: ${{ matrix.category }}
