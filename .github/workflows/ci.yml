name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Reads the code, writes nothing: whatever the repository's default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    # Services pour les tests d'intégration (gateway WS + Redis, accès DB).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: live
          POSTGRES_PASSWORD: live
          POSTGRES_DB: quizdock
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U live -d quizdock"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://live:live@localhost:5432/quizdock?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing is pushed from here

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        run: pnpm contracts:build

      - name: Lint
        run: pnpm lint
      - name: Locale consistency (keys, placeholders)
        run: pnpm --filter @quiz-dock/frontend i18n:check

      - name: Format check
        run: pnpm format

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate (DB de test)
        run: pnpm --filter @quiz-dock/backend exec prisma migrate deploy

      - name: Tests
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

      - name: OpenAPI/Orval drift check
        run: |
          pnpm generate:api
          if ! git diff --exit-code -- apps/backend/openapi/openapi.json apps/frontend/src/api/generated; then
            echo "::error::Client REST désynchronisé de l'OpenAPI. Lance 'pnpm generate:api' et committe le résultat."
            exit 1
          fi
