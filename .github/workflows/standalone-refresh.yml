name: Standalone refresh

# The :standalone image of the latest release, built again every week with the
# Debian fixes of the day: PostgreSQL, Redis and their dependencies (Perl…) age
# between two releases, and the Monday scan (security.yml, 04:27) reports them.
# Same version, same app: only the OS layer moves. No cache, or the apt-get
# upgrade layer would come back as it was at the release.
on:
  schedule:
    - cron: '7 2 * * 1' # Monday 02:07 UTC, before the scan
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-refresh
  cancel-in-progress: false

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - name: Latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Refreshing :standalone of $tag"

      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false # nothing is pushed from here

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: fchaussin/quizdock
          tags: |
            type=raw,value=standalone
            type=raw,value=standalone-${{ steps.release.outputs.version }}
          flavor: latest=false # :latest is the hardened image, never this one

      - name: Build & push standalone (multi-arch, no cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true # the base image of the day too
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.release.outputs.tag }}
            APP_IMAGE_TAG=${{ steps.release.outputs.version }}
          sbom: true
          provenance: mode=max

  # The public demo runs :standalone; Render does not watch the registry.
  deploy-demo:
    needs: standalone
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set — demo not redeployed."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          case "$code" in
            2*) echo "Render deploy triggered (HTTP $code)." ;;
            *) echo "::error::Render deploy hook answered HTTP $code (see release.yml, deploy-demo)."; exit 1 ;;
          esac
