name: Release

# Taguer une version (vX.Y.Z) est l'unique geste de release :
#   1. GitHub Release (source de vérité, canonique) — job `github-release`.
#   2. Images Docker Hub qui en découlent — jobs `publish` + `standalone`.
#   3. (Overview Docker Hub : workflow `dockerhub-readme.yml`, à chaque README poussé sur main.)
#   4. Redéploiement de la démo publique (Render, image :standalone) — job `deploy-demo`.
# Seul un tag strictement vX.Y.Z publie (job `gate`). Une pré-release (v1.2.0-rc.1,
# tout tag avec - ou +) ne crée qu'une Release GitHub marquée pré-release : aucune
# image, :latest intact, démo intacte. Idem pour un lancement manuel hors d'un tel tag.
# Secrets requis (repo → Settings → Secrets and variables → Actions) :
#   DOCKERHUB_USERNAME = fchaussin
#   DOCKERHUB_TOKEN    = access token Docker Hub (Read & Write)
#   RENDER_DEPLOY_HOOK = Deploy Hook URL du service Render (optionnel : sans lui,
#                        l'étape est sautée — Render ne surveille pas le registre).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: # relancer une release : choisir son tag vX.Y.Z comme ref, sinon rien n'est publié

permissions:
  contents: read

jobs:
  # ---- Garde-fou : stable = tag vX.Y.Z exact, rien d'autre ----
  gate:
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.check.outputs.stable }}
    steps:
      - id: check
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$REF is not a stable vX.Y.Z tag: no image, no :latest, no demo deploy."
          fi

  # ---- Source de vérité : Release GitHub + CHANGELOG (auto, pour chaque tag) ----
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # créer la Release + committer le CHANGELOG
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout main (historique complet)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main # on commit le CHANGELOG régénéré sur la branche
          fetch-depth: 0 # tout l'historique + tags pour git-cliff

      # Source de vérité d'abord : la Release est garantie même si le commit échoue.
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true # notes natives GitHub depuis commits/PRs
          prerelease: ${{ needs.gate.outputs.stable != 'true' }}
          make_latest: ${{ needs.gate.outputs.stable == 'true' }}
          name: QuizDock ${{ github.ref_name }}

      - name: Régénère CHANGELOG.md (git-cliff)
        if: needs.gate.outputs.stable == 'true'
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} --output CHANGELOG.md

      # Best-effort : ne doit jamais casser une release (ex. branche protégée).
      - name: Commit du CHANGELOG sur main
        if: needs.gate.outputs.stable == 'true'
        continue-on-error: true
        run: |
          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): changelog ${{ github.ref_name }} [skip ci]"
            git push origin HEAD:main
          fi

  publish:
    needs: gate
    if: needs.gate.outputs.stable == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # nothing is pushed from here

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: fchaussin/quizdock
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # What the image is made of, and how it was built, published with it.
          sbom: true
          provenance: mode=max

  # All-in-one image (Postgres + Redis + app) for one-command beginner use.
  # Reuses the exact artifact published above (COPY --from the X.Y.Z tag), so it runs after.
  standalone:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # nothing is pushed from here

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: fchaussin/quizdock
          tags: |
            type=raw,value=standalone
            type=semver,pattern=standalone-{{version}}
          # metadata-action's default `latest=auto` appends `latest` whenever a
          # semver tag matches — that silently re-pointed :latest at THIS image
          # after every release. :latest belongs to the hardened image above.
          flavor: latest=false

      # Pin the FROM of Dockerfile.standalone to the X.Y.Z image just pushed
      # (not a floating :latest, which depends on job order and registry state).
      - name: App image tag (X.Y.Z from vX.Y.Z)
        id: app
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push standalone (multi-arch)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            APP_IMAGE_TAG=${{ steps.app.outputs.tag }}
          cache-from: type=gha,scope=standalone
          cache-to: type=gha,mode=max,scope=standalone
          # What the image is made of, and how it was built, published with it.
          sbom: true
          provenance: mode=max

  # Public demo (Render, `:standalone` + DEMO_MODE=true). Render does not watch the
  # registry: without this POST the instance keeps running the cached image.
  deploy-demo:
    needs: standalone
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK not set — demo not redeployed."
            exit 0
          fi
          # Render answers 404 when the service was recreated or the hook key
          # regenerated: say so, instead of a bare `curl: (22)`.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          case "$code" in
            2*) echo "Render deploy triggered (HTTP $code)." ;;
            404) echo "::error::Render deploy hook answered 404 — the RENDER_DEPLOY_HOOK secret no longer matches the service. Copy the current Deploy Hook URL from Render → Settings, then: gh secret set RENDER_DEPLOY_HOOK && gh run rerun $GITHUB_RUN_ID --failed"; exit 1 ;;
            *) echo "::error::Render deploy hook answered HTTP $code."; exit 1 ;;
          esac
