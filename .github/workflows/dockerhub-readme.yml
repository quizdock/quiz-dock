name: Docker Hub overview

# The Docker Hub repo overview is docker/README.md (not the GitHub README):
# synced whenever it changes on main, so a fix after a tag still reaches Docker Hub.
# NB: the description endpoint usually needs the account password or a PAT;
# a plain read/write access token may be rejected — use a dedicated secret then.
on:
  push:
    branches: [main]
    paths: [docker/README.md]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dockerhub-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # nothing is pushed from here

      - name: Push README to Docker Hub overview
        uses: peter-evans/dockerhub-description@432a30c9e07499fd01da9f8a49f0faf9e0ca5b77 # v4.0.2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: fchaussin/quizdock
          readme-filepath: ./docker/README.md
